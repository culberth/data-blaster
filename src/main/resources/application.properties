spring.main.banner-mode=off

# The theme/Preferences execution trace (ThemeService, AppState.setTheme, DialogService,
# MainController, PreferencesController, GeneralTabController, SettingsService) is logged at DEBUG.
# System.Logger routes through JUL into Spring Boot's Logback, so this line is what makes those
# messages appear at all; comment it out to go back to a quiet console.
logging.level.com.culberth.tools.datablaster=DEBUG
